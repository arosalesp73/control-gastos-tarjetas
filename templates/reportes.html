<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Reporte</title>
    <style>
        {{ css | safe }}
        .container { max-width: 400px; margin: 30px auto; padding: 20px; }
        .card { background: var(--surface); padding: 25px; border-radius: 12px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85em; }
        select, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0f0f1a; color: white; box-sizing: border-box; }
        button { background: #6c63ff; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .btn-whatsapp { background: #25D366; color: black; margin-top: 10px; font-weight: bold; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 0.9em; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; }
        .back-link:hover { background: #333; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>📊 Exportar Excel</h2>
            <form id="formReporte">
                <div class="form-group">
                    <label>Seleccionar Tarjeta:</label>
                    <select name="tarjeta" id="tarjeta">
                        <option value="TODAS">-- Todas las tarjetas --</option>
                        {% for t in tarjetas %}
                        <option value="{{ t.nombre_tarjeta }}">{{ t.nombre_tarjeta }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Desde:</label>
                    <input type="date" name="fecha_inicio" id="fecha_inicio" required style="color-scheme: dark;">
                </div>

                <div class="form-group">
                    <label>Hasta:</label>
                    <input type="date" name="fecha_fin" id="fecha_fin" required style="color-scheme: dark;">
                </div>

                <button type="button" onclick="descargarReporte()">Descargar Reporte</button>
                <button type="button" id="btnWhatsApp" class="btn-whatsapp" onclick="enviarWhatsApp()">🚀 Enviar por WhatsApp</button>
            </form>

            <a href="/" class="back-link">⬅ Regresar al Inicio</a>
        </div>
    </div>

    <script>
        const hoy = new Date().toISOString().split('T')[0];
        const primero = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('fecha_inicio').value = primero;
        document.getElementById('fecha_fin').value = hoy;

        // Detectar si estamos en un dispositivo móvil o en una PC
        const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        window.onload = function() {
            const btnWhatsapp = document.getElementById('btnWhatsApp');
            if (!esMovil) {
                // Si está en la web (PC), deshabilitamos el botón y cambiamos su estilo
                btnWhatsapp.disabled = true;
                btnWhatsapp.style.background = '#444';
                btnWhatsapp.style.color = '#888';
                btnWhatsapp.style.cursor = 'not-allowed';
                btnWhatsapp.innerText = '🚫 WhatsApp solo disponible en App móvil';
            }
        };

        function descargarReporte() {
            const tarjeta = document.getElementById('tarjeta').value;
            const inicio = document.getElementById('fecha_inicio').value;
            const fin = document.getElementById('fecha_fin').value;

            window.location.href = `/reportes/excel?tarjeta=${encodeURIComponent(tarjeta)}&fecha_inicio=${inicio}&fecha_fin=${fin}`;
        }

        function enviarWhatsApp() {
            if (!esMovil) {
                alert("El envío directo por WhatsApp con archivo adjunto solo está disponible en la aplicación móvil.");
                return;
            }

            const tarjeta = document.getElementById('tarjeta').value;
            const inicio = document.getElementById('fecha_inicio').value;
            const fin = document.getElementById('fecha_fin').value;
            
            window.location.href = `/reportes/excel?tarjeta=${encodeURIComponent(tarjeta)}&fecha_inicio=${inicio}&fecha_fin=${fin}&accion=whatsapp`;
        }
    </script>
</body>
</html>
