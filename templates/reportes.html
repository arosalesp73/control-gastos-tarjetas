<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Reporte</title>
    <style>
        {{ css | safe }}
        .container { max-width: 400px; margin: 30px auto; padding: 20px; }
        .card { background: var(--surface); padding: 25px; border-radius: 12px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85em; }
        select, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0f0f1a; color: white; box-sizing: border-box; }
        button { background: #6c63ff; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Botón verde para WhatsApp */
        .btn-whatsapp { background: #25D366; color: black; margin-top: 10px; font-weight: bold; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>📊 Exportar Excel</h2>
            <form id="formReporte">
                <div class="form-group">
                    <label>Seleccionar Tarjeta:</label>
                    <select name="tarjeta" id="tarjeta">
                        <option value="TODAS">-- Todas las tarjetas --</option>
                        {% for t in tarjetas %}
                        <option value="{{ t.nombre_tarjeta }}">{{ t.nombre_tarjeta }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Desde:</label>
                    <input type="date" name="fecha_inicio" id="fecha_inicio" required style="color-scheme: dark;">
                </div>

                <div class="form-group">
                    <label>Hasta:</label>
                    <input type="date" name="fecha_fin" id="fecha_fin" required style="color-scheme: dark;">
                </div>

                <button type="button" onclick="descargarReporte()">Descargar Reporte</button>
                <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">🚀 Enviar Directo a WhatsApp</button>
            </form>
        </div>
    </div>

    <script>
        const hoy = new Date().toISOString().split('T')[0];
        const primero = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('fecha_inicio').value = primero;
        document.getElementById('fecha_fin').value = hoy;

        function mostrarAviso(mensaje) {
            const aviso = document.createElement("div");
            aviso.innerHTML = mensaje;
            aviso.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#ff4c4c; color:white; padding:15px; border-radius:8px; z-index:9999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family:sans-serif; text-align:center;";
            document.body.appendChild(aviso);
            setTimeout(() => aviso.remove(), 3500);
        }

        async function descargarReporte() {
            const tarjeta = document.getElementById('tarjeta').value;
            const inicio = document.getElementById('fecha_inicio').value;
            const fin = document.getElementById('fecha_fin').value;

            const url = `/reportes/excel?tarjeta=${encodeURIComponent(tarjeta)}&fecha_inicio=${inicio}&fecha_fin=${fin}`;
            
            try {
                const res = await fetch(url);
                
                if (!res.ok) {
                    mostrarAviso("No hay registros en este periodo para esta tarjeta.");
                    return;
                }

                const blob = await res.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.setAttribute('download', `Reporte_${tarjeta}_${inicio}_al_${fin}.xlsx`);
                
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                mostrarAviso("Ocurrió un error al generar el reporte.");
            }
        }

        async function enviarWhatsApp() {
            // Reutiliza exactamente la misma lógica de descarga para que la app lo intercepte y comparta el archivo
            await descargarReporte();
        }
    </script>
</body>
</html>
