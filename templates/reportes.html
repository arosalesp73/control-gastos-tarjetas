<!DOCTYPE html>
<html>
<head>
    <title>Reportes</title>
    <style>{{ css | safe }}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    <div class="card" style="max-width: 450px; width: 90%;">
        <h2 style="margin-top: 0; text-align: center;">Generar Reporte</h2>
        
        <!-- AQUI DEBE IR EXACTAMENTE EL MENSAJE DE ERROR -->
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/reportes/generar" method="get">
            <label>Tarjeta:</label>
            <select name="tarjeta">
                <option value="TODAS">TODAS LAS TARJETAS</option>
                {% for t in tarjetas %}
                <option value="{{ t.nombre_tarjeta }}">{{ t.nombre_tarjeta }}</option>
                {% endfor %}
            </select>

            <label>Fecha Inicio:</label>
            <input type="date" name="fecha_inicio">

            <label>Fecha Fin:</label>
            <input type="date" name="fecha_fin">

            <button type="submit" style="margin-top: 15px;">Descargar Excel</button>
        </form>
        
        <br>
        <a href="/" style="display: block; text-align: center; color: var(--text); text-decoration: none;">Volver al Inicio</a>
    </div>
</body>
</html>
