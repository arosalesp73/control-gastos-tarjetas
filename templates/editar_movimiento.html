<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Movimiento</title>
    <style>
        {{ css | safe }}
        .container { max-width: 400px; margin: 30px auto; padding: 20px; }
        .form-card { background: var(--surface); padding: 25px; border-radius: 12px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85em; }
        input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0f0f1a; color: white; margin-top: 5px; box-sizing: border-box; }
        button { background: #6c63ff; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.95em; transition: 0.3s; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2 style="margin-top: 0; font-size: 1.4em;">✏️ Editar Movimiento</h2>
            
            <form action="/movimientos/actualizar" method="post">
                <input type="hidden" name="id" value="{{ mov.id }}">
                <input type="hidden" name="tarjeta" value="{{ mov.tarjeta }}">
                
                <div class="form-group">
                    <label>Tipo:</label>
                    <select name="tipo_movimiento">
                        <option value="compra" {% if mov.tipo == 'compra' %}selected{% endif %}>🛍️ Compra / Gasto</option>
                        <option value="abono" {% if mov.tipo == 'abono' %}selected{% endif %}>💳 Abono / Pago a TDC</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Concepto:</label>
                    <input type="text" name="concepto" value="{{ mov.concepto }}" required>
                </div>
                
                <div class="form-group">
                    <label>Monto ($):</label>
                    <input type="number" step="0.01" name="monto" value="{{ mov.monto|string|replace('-', '') }}" required>
                </div>
                
                <div class="form-group">
                    <label>Fecha:</label>
                    <input type="date" name="fecha" value="{{ mov.fecha }}" required style="color-scheme: dark;">
                </div>

                <div class="form-group">
                    <label>Contraseña para confirmar:</label>
                    <input type="password" name="password" id="passInput" placeholder="Contraseña de usuario" required>
                </div>
    
                <button type="submit">Actualizar Movimiento</button>
            </form>

            <a href="/movimientos/nuevo/{{ mov.tarjeta }}" class="back-link">✖ Cancelar</a>
        </div> 
    </div> 

{% if error %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputPass = document.getElementById('passInput');
        if (inputPass) {
            inputPass.focus();
            inputPass.setCustomValidity('Contraseña incorrecta');
            inputPass.reportValidity();
            inputPass.oninput = function() { this.setCustomValidity(''); };
        }
    });
</script>
{% endif %}
    
</body>
</html>
